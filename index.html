<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Grade Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <header>
      <h1>Grade Checker</h1>
      <p class="subtitle">Type the grades of a student and see the result.</p>
    </header>

    <section class="card">
      <h2>Student Information</h2>

      <label for="studentName">Student name</label>
      <input type="text" id="studentName" placeholder="Example: Juan Dela Cruz">

      <h3>Subjects</h3>
      <div id="subjects"></div>
      <button id="addSubjectBtn">Add Subject</button>

      <div class="actions">
        <button id="checkBtn">Check Grades</button>
        <button id="saveBtn">Save Student</button>
        <button id="clearBtn">Clear</button>
      </div>

      <div id="result"></div>
    </section>

    <section class="card">
      <h2>Saved Students</h2>

      <div class="table-wrap">
        <table id="studentsTable">
          <thead>
            <tr>
              <th>Name</th>
              <th>Subjects</th>
              <th>Average</th>
              <th>Remark</th>
              <th>Letter</th>
              <th>Highest</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentsBody"></tbody>
        </table>
      </div>

      <button id="clearStudentsBtn">Clear All Students</button>
    </section>

  </div>

  <script src="grade.js"></script>
  <script src="app.js"></script>
</body>
</html>
