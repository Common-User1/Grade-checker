<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A grade checker for high school and college students.">
  <title>Grade Checker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>
<body>
  <div class="container">

    <header>
      <img src="logo.svg" alt="Grade Checker logo" class="logo">
      <h1>Grade Checker</h1>
      <p class="subtitle">Choose the type of student to start.</p>
    </header>

    <main class="choices">
      <a class="choice-card" href="highschool.html">
        <h2>High School</h2>
        <p>Quarterly grades from Q1 to Q4, final grade, general average, and honors.</p>
        <span class="choice-link">Open</span>
      </a>

      <a class="choice-card" href="college.html">
        <h2>College</h2>
        <p>Midterm and final term grades with units, GWA, and the 1.0 to 5.0 equivalent.</p>
        <span class="choice-link">Open</span>
      </a>
    </main>

    <footer>
      <p>Grade Checker by Common-User1</p>
      <p><a href="https://github.com/Common-User1/Grade-checker" target="_blank" rel="noopener">View on GitHub</a></p>
    </footer>

  </div>
</body>
</html>
