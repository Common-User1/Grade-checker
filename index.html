<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple web page that checks student grades and saves a list of students.">
  <title>Interactive Grade Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <header>
      <h1>Grade Checker</h1>
      <p class="subtitle">Type the grades of a student and see the result.</p>
    </header>

    <section class="card">
      <h2>Student Information</h2>

      <label for="studentName">Student name</label>
      <input type="text" id="studentName" placeholder="Example: Juan Dela Cruz">

      <h3>Subjects</h3>
      <div id="subjects"></div>
      <button id="addSubjectBtn">Add Subject</button>

      <div class="actions">
        <button id="checkBtn">Check Grades</button>
        <button id="saveBtn">Save Student</button>
        <button id="clearBtn">Clear</button>
      </div>

      <div id="result"></div>
    </section>

    <section class="card">
      <h2>Saved Students</h2>

      
      <div class="summary">
        <div class="summary-box">
          <span class="summary-number" id="totalStudents">0</span>
          <span class="summary-label">Total Students</span>
        </div>
        <div class="summary-box">
          <span class="summary-number" id="classAverage">0</span>
          <span class="summary-label">Class GWA</span>
        </div>
        <div class="summary-box">
          <span class="summary-number" id="passedCount">0</span>
          <span class="summary-label">Passed</span>
        </div>
        <div class="summary-box">
          <span class="summary-number" id="failedCount">0</span>
          <span class="summary-label">Failed</span>
        </div>
        <div class="summary-box">
          <span class="summary-number" id="topStudent">-</span>
          <span class="summary-label">Top Student</span>
        </div>
      </div>

      <div class="filter-bar">
        <input type="text" id="searchBox" placeholder="Search by name">

        <select id="filterSelect">
          <option value="all">All</option>
          <option value="Passed">Passed only</option>
          <option value="Failed">Failed only</option>
        </select>
      </div>

      <div class="table-wrap">
        <table id="studentsTable">
          <thead>
            <tr>
              <th class="sortable" data-column="name">Name <span class="arrow"></span></th>
              <th>Subjects</th>
              <th class="sortable" data-column="average">GWA <span class="arrow"></span></th>
              <th class="sortable" data-column="remark">Remark <span class="arrow"></span></th>
              <th class="sortable" data-column="letter">Letter <span class="arrow"></span></th>
              <th class="sortable" data-column="highest">Highest <span class="arrow"></span></th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="studentsBody"></tbody>
        </table>
      </div>

      <button id="clearStudentsBtn">Clear All Students</button>
    </section>

  </div>

  <footer>
    <p>Grade Checker by Common-User1</p>
    <p><a href="https://github.com/Common-User1/Grade-checker" target="_blank" rel="noopener">View on GitHub</a></p>
  </footer>

  <script src="grade.js"></script>
  <script src="app.js"></script>
</body>
</html>
