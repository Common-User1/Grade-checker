<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Grade Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Grade Checker</h1>

  <label>Student name:</label>
  <input type="text" id="studentName">

  <br><br>
  <h3>Subjects</h3>
  <div id="subjects"></div>
  <button id="addSubjectBtn">Add Subject</button>

  <br><br>
  <button id="checkBtn">Check Grades</button>
  <button id="saveBtn">Save Student</button>
  <button id="clearBtn">Clear</button>

  <div id="result"></div>

  <h2>Saved Students</h2>
  <table id="studentsTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Subjects</th>
        <th>Average</th>
        <th>Remark</th>
        <th>Letter</th>
        <th>Highest</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="studentsBody"></tbody>
  </table>

  <script src="grade.js"></script>
  <script src="app.js"></script>
</body>
</html>
